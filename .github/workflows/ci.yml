name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install pinned lint tools
        shell: bash
        run: |
          bin="$GITHUB_WORKSPACE/.cache/bin"
          mkdir -p "$bin"
          curl -fsSL https://get.helm.sh/helm-v4.3.2-linux-amd64.tar.gz |
            tar -xz -C "$bin" --strip-components=1 linux-amd64/helm
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz |
            tar -xz -C "$bin" kubeconform
          curl -fsSL https://github.com/mikefarah/yq/releases/download/v4.54.3/yq_linux_amd64 -o "$bin/yq"
          chmod +x "$bin/yq"
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz |
            tar -xz -C "$bin" actionlint
          curl -fsSL https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz |
            tar -xJ -C "$bin" --strip-components=1 shellcheck-v0.11.0/shellcheck
          echo "$bin" >> "$GITHUB_PATH"
      - run: make lint
