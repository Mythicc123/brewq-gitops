apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: brewq
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://github.com/Mythicc123/brewq-k8s
      targetRevision: main
      path: charts/brewq
      helm:
        releaseName: brewq
        valueFiles:
          - $values/envs/local/brewq-values.yaml
    - repoURL: https://github.com/Mythicc123/brewq-gitops
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: brewq
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
