apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: "93.10.1"
      helm:
        releaseName: kps
        valueFiles:
          - $obs/values/kube-prometheus-stack.yaml
          - $values/envs/local/kps-values.yaml
    - repoURL: https://github.com/Mythicc123/brewq-observability
      targetRevision: main
      ref: obs
    - repoURL: https://github.com/Mythicc123/brewq-gitops
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
